<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        text-align: center;
      }

      .box {
        background: rgba(255, 255, 255, 0.1);
        padding: 40px;
        border-radius: 12px;
        backdrop-filter: blur(10px);
        max-width: 420px;
      }

      h2 {
        margin-bottom: 15px;
      }

      p {
        margin-bottom: 25px;
        opacity: 0.9;
      }

      a {
        display: inline-block;
        padding: 12px 20px;
        background: white;
        color: #4f46e5;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
      }

      a:hover {
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h2>Password reset for {{email}}</h2>
      <p>You are being redirected to the password reset page...</p>
      <p>{{token}}</p>
      <a href="https://your-site.com/reset-password?token={{token}}">
        Click here if redirect doesn't work
      </a>
    </div>
  </body>
</html>
